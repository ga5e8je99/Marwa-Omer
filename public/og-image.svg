<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="45%" stop-color="#FFF9F5" />
      <stop offset="85%" stop-color="#FBF0EB" />
      <stop offset="100%" stop-color="#F4E3DF" />
    </linearGradient>
    <radialGradient id="ogGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F1D98B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFF9F6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78550E" />
      <stop offset="50%" stop-color="#B88624" />
      <stop offset="100%" stop-color="#78550E" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogSky)" />
  <circle cx="600" cy="240" r="320" fill="url(#ogGlow)" />

  <!-- Borders -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#C9A24B" stroke-width="2" stroke-opacity="0.6" />
  <rect x="44" y="44" width="1112" height="542" rx="18" fill="none" stroke="#C9A24B" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.5" />

  <!-- Content -->
  <text x="600" y="140" font-family="'Cairo', sans-serif" font-size="24" fill="#78550E" text-anchor="middle" font-weight="700">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
  <text x="600" y="180" font-family="'Cairo', sans-serif" font-size="18" fill="#78550E" text-anchor="middle" font-weight="600">دعوة زفاف مباركة</text>
  
  <text x="600" y="300" font-family="'Great Vibes', 'Pinyon Script', cursive" font-size="130" fill="url(#ogGold)" text-anchor="middle">Marwa &amp; Omer</text>

  <line x1="400" y1="360" x2="800" y2="360" stroke="#C9A24B" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="600" cy="360" r="5" fill="#78550E" />

  <text x="600" y="430" font-family="'Cairo', sans-serif" font-size="32" fill="#2C221E" text-anchor="middle" font-weight="800">الجمعة، 1 يناير 2027</text>
  <text x="600" y="480" font-family="'Cairo', sans-serif" font-size="22" fill="#78550E" text-anchor="middle" font-weight="600">قاعة رويال للمناسبات · الإسماعيلية، مصر</text>

  <text x="600" y="540" font-family="'Cairo', sans-serif" font-size="16" fill="#8A7468" text-anchor="middle">يسعدنا ويشرفنا حضوركم ومشاركتكم لنا فرحة العمر</text>
</svg>
