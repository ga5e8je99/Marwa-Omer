<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 950" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft Pink Watercolor Wash Gradient -->
    <linearGradient id="invCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F6" />
      <stop offset="35%" stop-color="#FCEEEB" />
      <stop offset="70%" stop-color="#F7E2DF" />
      <stop offset="100%" stop-color="#F4DADB" />
    </linearGradient>

    <!-- Faded Lake & Mountain Gradient -->
    <linearGradient id="invLake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7E4F2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E7D9EB" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="marbleGazebo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FAF1EC" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#EEDCD5" stop-opacity="0.6" />
    </linearGradient>

    <filter id="softBlurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- 1. Soft Pink Watercolor Background -->
  <rect width="600" height="950" fill="url(#invCardBg)" />

  <!-- Ambient watercolor blooms -->
  <circle cx="80" cy="120" r="130" fill="#F4D3D7" fill-opacity="0.45" filter="url(#softBlurFilter)" />
  <circle cx="520" cy="140" r="140" fill="#E8B4B8" fill-opacity="0.35" filter="url(#softBlurFilter)" />
  <circle cx="60" cy="480" r="120" fill="#F7E4E1" fill-opacity="0.5" filter="url(#softBlurFilter)" />
  <circle cx="300" cy="820" r="200" fill="#EBD9E8" fill-opacity="0.4" filter="url(#softBlurFilter)" />

  <!-- 2. Bottom Faded Mountain Silhouettes & Lake -->
  <path
    d="M 0 740 Q 140 680 270 710 Q 410 660 600 730 L 600 820 L 0 820 Z"
    fill="#D0C0D9"
    opacity="0.35"
  />
  <rect x="0" y="770" width="600" height="90" fill="url(#invLake)" />

  <!-- 3. Bottom Faded Marble Gazebo Scene -->
  <g transform="translate(180, 680)" opacity="0.45">
    <!-- Gazebo Dome -->
    <path
      d="M 50 80 Q 120 15 190 80 Z"
      fill="url(#marbleGazebo)"
      stroke="#C9A24B"
      stroke-width="1"
      stroke-opacity="0.4"
    />
    <circle cx="120" cy="20" r="5" fill="#B8913A" />
    <!-- Marble Columns -->
    <line x1="65" y1="80" x2="65" y2="160" stroke="#FFF9F5" stroke-width="6" stroke-linecap="round" />
    <line x1="102" y1="80" x2="102" y2="160" stroke="#FFF9F5" stroke-width="5" stroke-linecap="round" />
    <line x1="138" y1="80" x2="138" y2="160" stroke="#FFF9F5" stroke-width="5" stroke-linecap="round" />
    <line x1="175" y1="80" x2="175" y2="160" stroke="#FFF9F5" stroke-width="6" stroke-linecap="round" />
    <!-- Gazebo Base Steps -->
    <rect x="40" y="160" width="160" height="12" rx="3" fill="#FFF4EE" stroke="#C9A24B" stroke-width="0.8" stroke-opacity="0.3" />
  </g>

  <!-- 4. TOP-LEFT Pastel Roses & Leaves Framing -->
  <g transform="translate(-10, -10)">
    <!-- Foliage / Green Eucalyptus Leaves -->
    <path d="M 0 40 Q 30 10 70 30 Q 35 60 0 40 Z" fill="#9DBA9C" opacity="0.65" />
    <path d="M 40 10 Q 80 0 100 35 Q 60 50 40 10 Z" fill="#B1C8B0" opacity="0.6" />
    <path d="M 20 80 Q 60 70 85 105 Q 40 115 20 80 Z" fill="#8FA88E" opacity="0.65" />
    <path d="M 75 40 Q 120 30 145 65 Q 100 85 75 40 Z" fill="#A5BEA4" opacity="0.55" />
    <!-- Pastel Roses -->
    <circle cx="45" cy="50" r="26" fill="#F4CBD0" opacity="0.85" />
    <circle cx="45" cy="50" r="18" fill="#E8B4B8" opacity="0.9" />
    <circle cx="45" cy="50" r="9" fill="#FFF0F2" opacity="0.95" />

    <circle cx="95" cy="40" r="20" fill="#F8DFE2" opacity="0.85" />
    <circle cx="95" cy="40" r="13" fill="#EBB9BE" opacity="0.9" />

    <circle cx="35" cy="98" r="22" fill="#F2D3D6" opacity="0.8" />
    <circle cx="35" cy="98" r="14" fill="#E4A8AE" opacity="0.85" />

    <!-- Gold Stems / Berries -->
    <circle cx="115" cy="70" r="3" fill="#C9A24B" opacity="0.6" />
    <circle cx="128" cy="80" r="2.5" fill="#C9A24B" opacity="0.6" />
    <circle cx="70" cy="115" r="3" fill="#C9A24B" opacity="0.6" />
  </g>

  <!-- 5. TOP-RIGHT Pastel Roses & Leaves Framing -->
  <g transform="translate(470, -10)">
    <!-- Foliage -->
    <path d="M 120 40 Q 90 10 50 30 Q 85 60 120 40 Z" fill="#9DBA9C" opacity="0.65" />
    <path d="M 80 10 Q 40 0 20 35 Q 60 50 80 10 Z" fill="#B1C8B0" opacity="0.6" />
    <path d="M 100 80 Q 60 70 35 105 Q 80 115 100 80 Z" fill="#8FA88E" opacity="0.65" />
    <path d="M 45 40 Q 0 30 -25 65 Q 20 85 45 40 Z" fill="#A5BEA4" opacity="0.55" />
    <!-- Roses -->
    <circle cx="75" cy="50" r="26" fill="#F4CBD0" opacity="0.85" />
    <circle cx="75" cy="50" r="18" fill="#E8B4B8" opacity="0.9" />
    <circle cx="75" cy="50" r="9" fill="#FFF0F2" opacity="0.95" />

    <circle cx="25" cy="40" r="20" fill="#F8DFE2" opacity="0.85" />
    <circle cx="25" cy="40" r="13" fill="#EBB9BE" opacity="0.9" />

    <circle cx="85" cy="98" r="22" fill="#F2D3D6" opacity="0.8" />
    <circle cx="85" cy="98" r="14" fill="#E4A8AE" opacity="0.85" />

    <!-- Gold Berries -->
    <circle cx="5" cy="70" r="3" fill="#C9A24B" opacity="0.6" />
    <circle cx="-8" cy="80" r="2.5" fill="#C9A24B" opacity="0.6" />
  </g>

  <!-- 6. LEFT EDGE Floral & Vine Framing -->
  <g transform="translate(-15, 360)">
    <path d="M 15 0 Q 35 40 20 80 Q 40 120 18 160" fill="none" stroke="#A7C2A6" stroke-width="2" opacity="0.5" />
    <!-- Leaves -->
    <path d="M 22 25 Q 45 20 52 40 Q 30 50 22 25 Z" fill="#9DBA9C" opacity="0.6" />
    <path d="M 20 70 Q 48 65 55 85 Q 32 95 20 70 Z" fill="#B1C8B0" opacity="0.55" />
    <path d="M 22 120 Q 46 115 54 135 Q 30 145 22 120 Z" fill="#8FA88E" opacity="0.6" />
    <!-- Soft Small Rose Bloom on Left Vine -->
    <circle cx="36" cy="55" r="14" fill="#F4CBD0" opacity="0.85" />
    <circle cx="36" cy="55" r="9" fill="#E8B4B8" opacity="0.9" />
    <circle cx="36" cy="55" r="4" fill="#FFF0F2" opacity="0.95" />
    <circle cx="38" cy="105" r="12" fill="#F8DFE2" opacity="0.8" />
    <circle cx="38" cy="105" r="7" fill="#EBB9BE" opacity="0.85" />
  </g>

  <!-- Elegant Inner Gold Hairline Frame -->
  <rect
    x="24"
    y="24"
    width="552"
    height="902"
    rx="16"
    fill="none"
    stroke="#C9A24B"
    stroke-width="1"
    stroke-opacity="0.35"
  />
  <rect
    x="30"
    y="30"
    width="540"
    height="890"
    rx="12"
    fill="none"
    stroke="#C9A24B"
    stroke-width="0.5"
    stroke-dasharray="4,4"
    stroke-opacity="0.25"
  />
</svg>
