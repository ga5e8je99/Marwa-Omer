<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="walimaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F3" />
      <stop offset="60%" stop-color="#F7E4E1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="16" fill="url(#walimaGrad)" />
