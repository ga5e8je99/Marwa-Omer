    <circle cx="0" cy="5" r="8" fill="#F1D98B" fill-opacity="0.3" stroke="none" />
  </g>
  <text x="200" y="250" font-family="'Cinzel', serif" font-size="11" letter-spacing="3" fill="#8A7468" text-anchor="middle" opacity="0.8">THE LANTERN HALL</text>
