<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="closingWarmth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F5" />
      <stop offset="35%" stop-color="#FFF4EA" />
      <stop offset="70%" stop-color="#FCECE8" />
      <stop offset="100%" stop-color="#F8E5DF" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F1D98B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FCECE8" stop-opacity="0" />
    </radialGradient>

    <filter id="softVignette">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Warm Gold/Cream Watercolor Canvas -->
  <rect width="600" height="650" fill="url(#closingWarmth)" />
  <circle cx="300" cy="260" r="220" fill="url(#centerGlow)" filter="url(#softVignette)" />

  <!-- Subtle Watercolor Blobs -->
  <circle cx="100" cy="450" r="140" fill="#E8B4B8" fill-opacity="0.25" filter="url(#softVignette)" />
  <circle cx="500" cy="460" r="140" fill="#CFC3DD" fill-opacity="0.2" filter="url(#softVignette)" />

  <!-- Delicate Hairline Border -->
  <rect
    x="20"
    y="20"
    width="560"
    height="610"
    rx="16"
    fill="none"
    stroke="#C9A24B"
    stroke-width="0.8"
    stroke-opacity="0.35"
    stroke-dasharray="6,4"
  />
  <rect
    x="26"
    y="26"
    width="548"
    height="598"
    rx="12"
    fill="none"
    stroke="#C9A24B"
    stroke-width="0.5"
    stroke-opacity="0.2"
  />
</svg>
