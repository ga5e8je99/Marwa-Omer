<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 90" width="100%" height="90" preserveAspectRatio="none">
  <defs>
    <linearGradient id="landscapeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2EDF8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FCEEEB" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFF8F3" />
    </linearGradient>
    <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFC3DD" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#E8B4B8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="hillNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B3A3C7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#F7E4E1" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Sky Wash -->
  <rect width="600" height="90" fill="url(#landscapeSky)" />

  <!-- Distant Mountains -->
  <path
    d="M 0 55 Q 120 30 240 45 Q 360 25 480 40 L 600 50 L 600 90 L 0 90 Z"
    fill="url(#hillFar)"
  />

  <!-- Near Hills with Soft Trees Silhouette -->
  <path
    d="M 0 65 Q 150 48 300 58 Q 450 46 600 62 L 600 90 L 0 90 Z"
    fill="url(#hillNear)"
  />

  <!-- Subtle Gold Waterline -->
  <line x1="0" y1="88" x2="600" y2="88" stroke="#C9A24B" stroke-width="0.8" stroke-opacity="0.35" />
</svg>
