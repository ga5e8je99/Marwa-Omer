<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep realistic wax drop shadow -->
    <filter id="sealShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#421E0B" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#240D04" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#FFEBB3" flood-opacity="0.5" />
    </filter>

    <!-- Metallic gold gradients -->
    <linearGradient id="goldMelt" x1="50" y1="50" x2="460" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5DE88" />
      <stop offset="22%" stop-color="#E5BA4F" />
      <stop offset="48%" stop-color="#FDF2BC" />
      <stop offset="72%" stop-color="#BA882A" />
      <stop offset="100%" stop-color="#6E4407" />
    </linearGradient>

    <linearGradient id="goldLip" x1="100" y1="80" x2="420" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8D4" />
      <stop offset="30%" stop-color="#DFAC37" />
      <stop offset="65%" stop-color="#FFECA1" />
      <stop offset="100%" stop-color="#7A4C07" />
    </linearGradient>

    <radialGradient id="matrixBed" cx="235" cy="235" r="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A73B" />
      <stop offset="65%" stop-color="#B88624" />
      <stop offset="88%" stop-color="#8F6212" />
      <stop offset="100%" stop-color="#5E3C05" />
    </radialGradient>

    <linearGradient id="embossDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F2F04" />
      <stop offset="100%" stop-color="#734B0B" />
    </linearGradient>

    <linearGradient id="embossLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5BD" />
      <stop offset="100%" stop-color="#D19E2B" />
    </linearGradient>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- 1. Organic melted outer puddle -->
    <path d="M 456.0,256.0 Q 456.0,256.0 457.9,266.0 Q 459.7,276.1 458.7,286.1 Q 457.8,296.1 454.4,305.7 Q 451.1,315.2 446.4,324.0 Q 441.7,332.9 436.3,341.2 Q 430.9,349.5 425.2,357.4 Q 419.4,365.2 413.1,372.5 Q 406.7,379.7 399.6,386.1 Q 392.5,392.5 384.6,397.8 Q 376.8,403.2 368.6,407.8 Q 360.5,412.4 353.3,418.6 Q 346.2,424.8 340.0,434.3 Q 333.8,443.8 326.4,453.8 Q 319.1,463.9 308.9,467.2 Q 298.6,470.4 288.5,476.8 Q 278.4,483.2 267.2,488.6 Q 256.0,494.0 245.2,484.4 Q 234.5,474.7 224.9,467.6 Q 215.3,460.5 205.0,459.5 Q 194.6,458.5 185.5,453.2 Q 176.5,448.0 168.5,441.3 Q 160.5,434.6 152.2,429.3 Q 143.8,423.9 134.4,419.8 Q 124.9,415.7 117.3,409.1 Q 109.6,402.4 104.7,393.3 Q 99.8,384.2 97.5,373.8 Q 95.2,363.5 94.2,353.2 Q 93.2,343.0 91.9,333.8 Q 90.6,324.5 87.6,316.2 Q 84.7,308.0 80.0,300.0 Q 75.3,292.0 69.9,283.4 Q 64.6,274.9 60.3,265.4 Q 56.0,256.0 54.1,246.0 Q 52.3,235.9 53.3,225.9 Q 54.2,215.9 57.6,206.3 Q 60.9,196.8 65.6,188.0 Q 70.3,179.1 75.7,170.8 Q 81.1,162.5 86.8,154.6 Q 92.6,146.8 98.9,139.5 Q 105.3,132.3 112.4,125.9 Q 119.5,119.5 127.4,114.2 Q 135.2,108.8 143.4,104.2 Q 151.5,99.6 159.6,95.2 Q 167.7,90.8 175.7,86.1 Q 183.7,81.4 191.9,76.5 Q 200.0,71.5 208.8,67.0 Q 217.5,62.6 227.0,59.7 Q 236.4,56.8 246.2,56.4 Q 256.0,56.0 265.7,58.0 Q 275.3,60.0 284.5,63.5 Q 293.6,66.9 302.4,70.5 Q 311.2,74.0 320.2,76.8 Q 329.1,79.5 338.7,81.5 Q 348.2,83.5 358.2,85.8 Q 368.2,88.1 377.6,92.2 Q 387.1,96.3 394.7,102.9 Q 402.4,109.6 407.3,118.7 Q 412.2,127.8 414.5,138.2 Q 416.8,148.5 417.8,158.8 Q 418.8,169.0 420.1,178.2 Q 421.4,187.5 424.4,195.8 Q 427.3,204.0 432.0,212.0 Q 436.7,220.0 442.1,228.6 Q 447.4,237.1 451.7,246.6 Z" fill="url(#goldMelt)" />

    <!-- 2. Melted outer lip highlight ring -->
    <path d="M 456.0,256.0 Q 456.0,256.0 457.9,266.0 Q 459.7,276.1 458.7,286.1 Q 457.8,296.1 454.4,305.7 Q 451.1,315.2 446.4,324.0 Q 441.7,332.9 436.3,341.2 Q 430.9,349.5 425.2,357.4 Q 419.4,365.2 413.1,372.5 Q 406.7,379.7 399.6,386.1 Q 392.5,392.5 384.6,397.8 Q 376.8,403.2 368.6,407.8 Q 360.5,412.4 353.3,418.6 Q 346.2,424.8 340.0,434.3 Q 333.8,443.8 326.4,453.8 Q 319.1,463.9 308.9,467.2 Q 298.6,470.4 288.5,476.8 Q 278.4,483.2 267.2,488.6 Q 256.0,494.0 245.2,484.4 Q 234.5,474.7 224.9,467.6 Q 215.3,460.5 205.0,459.5 Q 194.6,458.5 185.5,453.2 Q 176.5,448.0 168.5,441.3 Q 160.5,434.6 152.2,429.3 Q 143.8,423.9 134.4,419.8 Q 124.9,415.7 117.3,409.1 Q 109.6,402.4 104.7,393.3 Q 99.8,384.2 97.5,373.8 Q 95.2,363.5 94.2,353.2 Q 93.2,343.0 91.9,333.8 Q 90.6,324.5 87.6,316.2 Q 84.7,308.0 80.0,300.0 Q 75.3,292.0 69.9,283.4 Q 64.6,274.9 60.3,265.4 Q 56.0,256.0 54.1,246.0 Q 52.3,235.9 53.3,225.9 Q 54.2,215.9 57.6,206.3 Q 60.9,196.8 65.6,188.0 Q 70.3,179.1 75.7,170.8 Q 81.1,162.5 86.8,154.6 Q 92.6,146.8 98.9,139.5 Q 105.3,132.3 112.4,125.9 Q 119.5,119.5 127.4,114.2 Q 135.2,108.8 143.4,104.2 Q 151.5,99.6 159.6,95.2 Q 167.7,90.8 175.7,86.1 Q 183.7,81.4 191.9,76.5 Q 200.0,71.5 208.8,67.0 Q 217.5,62.6 227.0,59.7 Q 236.4,56.8 246.2,56.4 Q 256.0,56.0 265.7,58.0 Q 275.3,60.0 284.5,63.5 Q 293.6,66.9 302.4,70.5 Q 311.2,74.0 320.2,76.8 Q 329.1,79.5 338.7,81.5 Q 348.2,83.5 358.2,85.8 Q 368.2,88.1 377.6,92.2 Q 387.1,96.3 394.7,102.9 Q 402.4,109.6 407.3,118.7 Q 412.2,127.8 414.5,138.2 Q 416.8,148.5 417.8,158.8 Q 418.8,169.0 420.1,178.2 Q 421.4,187.5 424.4,195.8 Q 427.3,204.0 432.0,212.0 Q 436.7,220.0 442.1,228.6 Q 447.4,237.1 451.7,246.6 Z" fill="none" stroke="url(#goldLip)" stroke-width="5" opacity="0.9" />

    <!-- 3. Recessed matrix circular depression -->
    <circle cx="256" cy="256" r="166" fill="url(#matrixBed)" />
    <circle cx="256" cy="256" r="166" fill="none" stroke="#523204" stroke-width="3.5" opacity="0.8" />
    <circle cx="256" cy="256" r="163" fill="none" stroke="#FFEAA1" stroke-width="2" opacity="0.5" />

    <!-- 4. Raised inner circular rim -->
    <circle cx="256" cy="256" r="146" fill="none" stroke="url(#goldLip)" stroke-width="5" />
    <circle cx="256" cy="256" r="141" fill="none" stroke="#5C3805" stroke-width="2" opacity="0.9" />
    <circle cx="256" cy="256" r="138" fill="none" stroke="#FFF2B8" stroke-width="1.5" opacity="0.9" />

    <!-- 5. Beaded inner perimeter ring -->
    <circle cx="256" cy="256" r="130" fill="none" stroke="#FFEDB8" stroke-width="2.5" stroke-dasharray="3 5" opacity="0.8" />

    <!-- 6. Embossed Arabic Calligraphy in 3 prominent lines -->
    <!-- Shadow pass (offset 1.8px down) -->
    <g transform="translate(0, 2)" fill="url(#embossDark)" opacity="0.95">
      <text x="256" y="212" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', serif" 
            font-size="36" font-weight="bold" text-anchor="middle" direction="rtl">
        بِسْمِ اللهِ
      </text>
      <text x="256" y="260" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', serif" 
            font-size="38" font-weight="bold" text-anchor="middle" direction="rtl">
        الرَّحْمَٰنِ
      </text>
      <text x="256" y="308" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', serif" 
            font-size="38" font-weight="bold" text-anchor="middle" direction="rtl">
        الرَّحِيمِ
      </text>
    </g>

    <!-- Highlighted gold face pass -->
    <g fill="url(#embossLight)">
      <text x="256" y="210" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', serif" 
            font-size="36" font-weight="bold" text-anchor="middle" direction="rtl">
        بِسْمِ اللهِ
      </text>
      <text x="256" y="258" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', serif" 
            font-size="38" font-weight="bold" text-anchor="middle" direction="rtl">
        الرَّحْمَٰنِ
      </text>
      <text x="256" y="306" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', 'Noto Naskh Arabic', serif" 
            font-size="38" font-weight="bold" text-anchor="middle" direction="rtl">
        الرَّحِيمِ
      </text>
    </g>

    <!-- Glossy specular reflection sheen on the seal -->
    <path d="M 155,160 C 205,120 305,120 355,160 C 315,135 195,135 155,160 Z" 
          fill="#FFFFFF" opacity="0.4" />
  </g>
</svg>