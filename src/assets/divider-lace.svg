<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="60" preserveAspectRatio="none">
  <defs>
    <linearGradient id="goldLace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8913A" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#C9A24B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F1D98B" />
      <stop offset="75%" stop-color="#C9A24B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B8913A" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="islamicPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#C9A24B" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="20" cy="20" r="6" fill="none" stroke="#E7CB84" stroke-width="0.7" stroke-opacity="0.5" />
      <path d="M 20 5 L 25 15 L 35 20 L 25 25 L 20 35 L 15 25 L 5 20 L 15 15 Z" fill="#F1D98B" fill-opacity="0.18" />
    </pattern>
  </defs>
  
  <!-- Subtle background pattern band -->
  <rect x="0" y="10" width="800" height="40" fill="url(#islamicPattern)" />
  
  <!-- Top and Bottom Delicate Accent Lines -->
  <line x1="20" y1="10" x2="780" y2="10" stroke="url(#goldLace)" stroke-width="1.2" />
  <line x1="60" y1="14" x2="740" y2="14" stroke="url(#goldLace)" stroke-width="0.6" stroke-dasharray="3,3" />
  <line x1="60" y1="46" x2="740" y2="46" stroke="url(#goldLace)" stroke-width="0.6" stroke-dasharray="3,3" />
  <line x1="20" y1="50" x2="780" y2="50" stroke="url(#goldLace)" stroke-width="1.2" />
  
  <!-- Center Medallion Emblem -->
  <g transform="translate(400, 30)">
    <circle cx="0" cy="0" r="14" fill="#FFF8F3" stroke="#C9A24B" stroke-width="1.2" />
    <path d="M 0 -8 L 6 0 L 0 8 L -6 0 Z" fill="#B8913A" />
    <circle cx="0" cy="0" r="2.5" fill="#FFF8F3" />
  </g>
</svg>
